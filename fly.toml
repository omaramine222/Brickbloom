app = "brickbloom"          # change to a unique name
primary_region = "fra"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"

[[mounts]]
  source = "bb_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
